services:
  database:
    image: postgres:15-alpine
    container_name: transcendance_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgresqldata:/var/lib/postgresql/data
  
  backend:
    build: ./backend
    container_name: transcendance_backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - database
  
  frontend:
    build: ./frontend
    container_name: transcendance_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgresqldata: